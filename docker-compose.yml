version: '2.4'

services:
  cups:
    container_name: cups
    build:
      context: .
    restart: unless-stopped
    environment:
      - CUPS_USER=admin
      - CUPS_PASS=admin
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/dbus:/run/dbus
      - ./drivers:/opt/drivers
    ports:
      - 631:631/tcp
      - 631:631/udp
    device_cgroup_rules:
      - 'c 189:* rmw'
